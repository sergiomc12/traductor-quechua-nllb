plugins { id 'com.android.application' }
android {
    namespace 'pe.uni.traductorquechua'
    compileSdk 34
    defaultConfig {
        applicationId 'pe.uni.traductorquechua'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
        buildConfigField 'String', 'API_URL', "\"${project.findProperty('API_URL')}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile file(project.findProperty('KS_FILE') ?: 'release.keystore')
            storePassword project.findProperty('KS_PASS') ?: ''
            keyAlias 'traductor'
            keyPassword project.findProperty('KS_PASS') ?: ''
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
